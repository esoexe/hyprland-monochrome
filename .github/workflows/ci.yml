name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Pure C11, shell, Lua, and installer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc make jq shellcheck lua5.4

      - name: Compile Pure C11 tools (-std=c11 -Wall -Wextra -Werror)
        run: make -j"$(nproc)"

      - name: Run full verification suite
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: bash test/run-all.sh

      - name: Run isolated installer & uninstaller sandbox suite
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: bash test/install-sandbox.sh
