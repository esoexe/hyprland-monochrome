  <rect x="1178" y="656" width="404" height="150" rx="10" class="win"/>
  <rect x="1194" y="672" width="118" height="118" rx="6" fill="#242424" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="1326" y="702" class="txt">Midnight City</text>
  <text x="1326" y="724" class="dim">M83</text>
  <text x="1326" y="752" class="faint" font-size="11">2:41 / 4:03</text>
  <rect x="1326" y="766" width="240" height="4" rx="2" fill="#2a2a2a"/>
  <rect x="1326" y="766" width="140" height="4" rx="2" fill="#e6e6e6"/>
  <text x="1326" y="794" class="dim" font-size="12">Playing</text>

  <!-- ── top bar ───────────────────────────────────────────────────────── -->
  <!-- left group -->
  <rect x="8" y="6" width="742" height="38" rx="12" class="pill"/>
  <text x="24" y="31" class="bright" font-size="15">▲</text>
  <rect x="52" y="13" width="26" height="24" rx="7" fill="#e6e6e6"/>
  <text x="60" y="30" fill="#0a0a0a" font-size="12" font-weight="bold">1</text>
  <text x="90" y="30" class="faint">2</text>
  <text x="112" y="30" class="faint">3</text>
  <text x="134" y="30" fill="#6f6f6f" font-size="12">4</text>
  <text x="156" y="30" fill="#6f6f6f" font-size="12">5</text>
  <text x="190" y="30" class="dim">~/projects/monochrome — kitty</text>

  <!-- center group: now playing -->
  <rect x="700" y="6" width="330" height="38" rx="12" class="pill"/>
  <text x="722" y="30" class="dim">♪</text>
  <text x="744" y="30" class="txt">Midnight City — M83</text>

  <!-- right group -->
  <rect x="1042" y="6" width="550" height="38" rx="12" class="pill"/>
  <text x="1060" y="30" class="dim">cpu</text>
  <text x="1096" y="30" class="txt">12%</text>
  <text x="1140" y="30" class="dim">ram</text>
  <text x="1178" y="30" class="txt">42%</text>
  <text x="1222" y="30" class="dim">48°C</text>
  <text x="1272" y="30" class="txt">󰖩</text>
  <text x="1272" y="30" class="dim">wlan0</text>
  <text x="1344" y="30" class="dim">vol</text>
  <text x="1378" y="30" class="txt">65%</text>
  <text x="1424" y="30" class="txt">󰁹</text>
  <text x="1424" y="30" class="dim">88%</text>
  <text x="1478" y="30" class="bright">21:42</text>
  <text x="1548" y="30" class="dim">⚙</text>
  <text x="1572" y="30" class="dim">⏻</text>

  <!-- ── rofi launcher overlay ────────────────────────────────────────── -->
  <rect x="0" y="0" width="1600" height="900" fill="#050505" opacity="0.45"/>
  <rect x="470" y="230" width="660" height="440" rx="14" class="card"/>
  <rect x="486" y="246" width="628" height="46" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="504" y="275" class="dim">apps:</text>
  <text x="556" y="275" class="bright">term</text>
  <rect x="600" y="258" width="7" height="20" fill="#e6e6e6" opacity="0.85"/>

  <rect x="486" y="304" width="628" height="40" rx="9" fill="#e6e6e6"/>
  <text x="506" y="330" fill="#0a0a0a" font-size="13" font-weight="bold">Terminal</text>
  <text x="1064" y="330" fill="#0a0a0a" font-size="12">kitty</text>

  <text x="506" y="372" class="txt">Terminal (floating)</text>
  <text x="1064" y="372" class="faint">kitty</text>
  <text x="506" y="410" class="txt">Dropdown terminal</text>
  <text x="1064" y="410" class="faint">kitty</text>
  <text x="506" y="448" class="txt">System Monitor</text>
  <text x="1064" y="448" class="faint">btop</text>
  <text x="506" y="486" class="txt">Settings</text>
  <text x="1064" y="486" class="faint">settings.sh</text>
  <text x="506" y="524" class="txt">Thunar</text>
  <text x="1064" y="524" class="faint">file manager</text>
  <text x="506" y="562" class="txt">Wallpaper picker</text>
  <text x="1064" y="562" class="faint">wallpaper.sh</text>
  <text x="506" y="600" class="txt">Spotify</text>
  <text x="1064" y="600" class="faint">flatpak</text>
  <text x="1064" y="562" class="faint"> </text>
  <text x="506" y="638" class="txt">Clipboard history</text>
  <text x="1064" y="638" class="faint">cliphist</text>

  <!-- ── caption ──────────────────────────────────────────────────────── -->
  <rect x="470" y="700" width="660" height="62" rx="12" fill="rgba(8,8,8,0.72)" stroke="rgba(255,255,255,0.07)"/>
  <text x="492" y="726" class="dim" font-size="12">Super + D launcher  ·  Super + W wallpapers  ·  Super + I settings</text>
  <text x="492" y="748" class="faint" font-size="12">Super + Tab lock  ·  Super + / cheat sheet  ·  Super + Shift + W hide bar</text>
</svg>
