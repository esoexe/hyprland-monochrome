<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" role="img" aria-label="Architecture and runtime telemetry">
  <defs>
    <linearGradient id="pulseBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="175" rx="12" fill="#0d0b0b" stroke="#2f2b2b" />

  <!-- Interconnect Rail -->
  <line x1="60" y1="88" x2="1140" y2="88" stroke="#3d3838" stroke-width="1" stroke-dasharray="4 4" />
  <rect x="-120" y="87" width="120" height="2" fill="url(#pulseBeam)">
    <animate attributeName="x" values="-120;1200" dur="4.2s" repeatCount="indefinite" />
  </rect>

  <!-- Card 01 -->
  <g transform="translate(24, 24)">
    <rect width="270" height="128" rx="8" fill="#141212" stroke="#3d3838" />
    <circle cx="248" cy="22" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="26" class="mono" font-size="10.5" fill="#7f7a7a">01 / HARDWARE PROBE</text>
    <text x="18" y="52" class="mono" font-size="14" font-weight="700" fill="#fdfcfc">Adaptive PC Engine</text>
    <text x="18" y="76" class="sans" font-size="12" fill="#b8b2b2">AMD, Intel, NVIDIA DRM,</text>
    <text x="18" y="94" class="sans" font-size="12" fill="#b8b2b2">Hybrid Optimus &amp; VM profiles</text>
    <text x="18" y="114" class="mono" font-size="10.5" fill="#7f7a7a">/sys + /proc in &lt;0.2ms</text>
  </g>

  <!-- Card 02 -->
  <g transform="translate(318, 24)">
    <rect width="270" height="128" rx="8" fill="#141212" stroke="#3d3838" />
    <circle cx="248" cy="22" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="26" class="mono" font-size="10.5" fill="#7f7a7a">02 / COMPOSITOR CORE</text>
    <text x="18" y="52" class="mono" font-size="14" font-weight="700" fill="#fdfcfc">Hyprland 0.56 Lua</text>
    <text x="18" y="76" class="sans" font-size="12" fill="#b8b2b2">Damped physical springs,</text>
    <text x="18" y="94" class="sans" font-size="12" fill="#b8b2b2">5 GLSL shaders &amp; Direct Scanout</text>
    <text x="18" y="114" class="mono" font-size="10.5" fill="#7f7a7a">G2 squircle + optical glass</text>
  </g>

  <!-- Card 03 -->
  <g transform="translate(612, 24)">
    <rect width="270" height="128" rx="8" fill="#141212" stroke="#3d3838" />
    <circle cx="248" cy="22" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="26" class="mono" font-size="10.5" fill="#7f7a7a">03 / RUNTIME ROUTING</text>
    <text x="18" y="52" class="mono" font-size="14" font-weight="700" fill="#fdfcfc">Universal App Layer</text>
    <text x="18" y="76" class="sans" font-size="12" fill="#b8b2b2">Wayland, XWayland, Ozone,</text>
    <text x="18" y="94" class="sans" font-size="12" fill="#b8b2b2">Java AWT, Flatpak &amp; AppImage</text>
    <text x="18" y="114" class="mono" font-size="10.5" fill="#7f7a7a">7/7 toolkits pure greyscale</text>
  </g>

  <!-- Card 04 -->
  <g transform="translate(906, 24)">
    <rect width="270" height="128" rx="8" fill="#131010" stroke="#646262" />
    <circle cx="248" cy="22" r="3.5" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="26" class="mono" font-size="10.5" fill="#7f7a7a">04 / WEB WORKSPACE</text>
    <text x="18" y="52" class="mono" font-size="14" font-weight="700" fill="#fdfcfc">1px Browser Grid</text>
    <text x="18" y="76" class="sans" font-size="12" fill="#b8b2b2">Firefox, Zen, Chromium, Brave</text>
    <text x="18" y="94" class="sans" font-size="12" fill="#b8b2b2">&amp; Qutebrowser chrome + newtab</text>
    <text x="18" y="114" class="mono" font-size="10.5" fill="#7f7a7a">#131010 / #201d1d / #3d3838</text>
  </g>
</svg>
