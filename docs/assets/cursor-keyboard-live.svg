<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="Live animated Bespoke Monochrome Cursor Suite and Keyboard Type Studio">
  <defs>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#222020" />
      <rect x="6" width="6" height="6" fill="#171515" />
      <rect y="6" width="6" height="6" fill="#171515" />
      <rect x="6" y="6" width="6" height="6" fill="#222020" />
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes spinWatch {
        to { transform: rotate(360deg); }
      }
      @keyframes cardGlow1 { 0%, 23% { stroke: #ffffff; stroke-width: 1.6; } 25%, 100% { stroke: #343030; stroke-width: 1; } }
      @keyframes cardGlow2 { 0%, 24% { stroke: #343030; stroke-width: 1; } 25%, 48% { stroke: #ffffff; stroke-width: 1.6; } 50%, 100% { stroke: #343030; stroke-width: 1; } }
      @keyframes cardGlow3 { 0%, 49% { stroke: #343030; stroke-width: 1; } 50%, 73% { stroke: #ffffff; stroke-width: 1.6; } 75%, 100% { stroke: #343030; stroke-width: 1; } }
      @keyframes cardGlow4 { 0%, 74% { stroke: #343030; stroke-width: 1; } 75%, 98% { stroke: #ffffff; stroke-width: 1.6; } 100% { stroke: #343030; stroke-width: 1; } }
      @keyframes keyPulseA { 0%, 100% { fill: #181616; } 15%, 30% { fill: #f2f2f2; } }
      @keyframes keyPulseB { 0%, 100% { fill: #181616; } 40%, 55% { fill: #f2f2f2; } }
      @keyframes keyPulseC { 0%, 100% { fill: #181616; } 65%, 80% { fill: #f2f2f2; } }
      @keyframes txtPulseA { 0%, 100% { fill: #d8d4d4; } 15%, 30% { fill: #080808; } }
      @keyframes txtPulseB { 0%, 100% { fill: #d8d4d4; } 40%, 55% { fill: #080808; } }
      @keyframes txtPulseC { 0%, 100% { fill: #d8d4d4; } 65%, 80% { fill: #080808; } }
      .watch-rot { transform-origin: 536px 251px; animation: spinWatch 1.1s linear infinite; }
      .c1 { animation: cardGlow1 8s infinite; }
      .c2 { animation: cardGlow2 8s infinite; }
      .c3 { animation: cardGlow3 8s infinite; }
      .c4 { animation: cardGlow4 8s infinite; }
      .kp1 { animation: keyPulseA 4.8s infinite; }
      .kp2 { animation: keyPulseB 4.8s infinite; }
      .kp3 { animation: keyPulseC 4.8s infinite; }
      .kt1 { animation: txtPulseA 4.8s infinite; }
      .kt2 { animation: txtPulseB 4.8s infinite; }
      .kt3 { animation: txtPulseC 4.8s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .watch-rot, .c1, .c2, .c3, .c4, .kp1, .kp2, .kp3, .kt1, .kt2, .kt3 { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0.5" y="0.5" width="1199" height="309" rx="12" fill="#090808" stroke="#302c2c" />

  <!-- ===================================================================== -->
  <!-- LEFT PANEL: BESPOKE MONOCHROME CURSOR SUITE (hyprcursor + Xcursor)    -->
  <!-- ===================================================================== -->
  <rect x="20" y="20" width="570" height="270" rx="9" fill="#110f0f" stroke="#2e2a2a" />
  <text x="38" y="46" class="mono" font-size="11" font-weight="700" fill="#8e8888" letter-spacing="0.06em">
    01 / BESPOKE CURSOR SUITE (HYPRCURSOR .HLC + XCURSOR)
  </text>
  <rect x="442" y="31" width="130" height="22" rx="5" fill="#1c1919" stroke="#3d3838" />
  <text x="507" y="46" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#fdfcfc">
    Super + Alt + C
  </text>
  <line x1="20" y1="62" x2="590" y2="62" stroke="#262323" />

  <!-- Card 1: Obsidian -->
  <g>
    <rect class="c1" x="36" y="76" width="124" height="134" rx="8" fill="#151313" stroke="#343030" />
    <rect x="48" y="88" width="100" height="72" rx="6" fill="#191717" stroke="#383434" />
    <g transform="translate(74, 95)">
      <polygon points="6,2 6,47 19,36 26,50 33,46 26,32 40,32" fill="#f5f5f5" />
      <polygon points="9,7 9,42 19,33 26,46 30,44 23,30 35,30" fill="#090909" />
    </g>
    <text x="98" y="180" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">Obsidian</text>
    <text x="98" y="196" text-anchor="middle" class="mono" font-size="9.5" fill="#8b8585">#0a0a0a + silver</text>
  </g>

  <!-- Card 2: Ivory -->
  <g>
    <rect class="c2" x="172" y="76" width="124" height="134" rx="8" fill="#151313" stroke="#343030" />
    <rect x="184" y="88" width="100" height="72" rx="6" fill="#191717" stroke="#383434" />
    <g transform="translate(210, 95)">
      <polygon points="6,2 6,47 19,36 26,50 33,46 26,32 40,32" fill="#080808" />
      <polygon points="9,7 9,42 19,33 26,46 30,44 23,30 35,30" fill="#f7f7f7" />
    </g>
    <text x="234" y="180" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">Ivory</text>
    <text x="234" y="196" text-anchor="middle" class="mono" font-size="9.5" fill="#8b8585">#f7f7f7 + dark</text>
  </g>

  <!-- Card 3: Precision -->
  <g>
    <rect class="c3" x="308" y="76" width="124" height="134" rx="8" fill="#151313" stroke="#343030" />
    <rect x="320" y="88" width="100" height="72" rx="6" fill="#191717" stroke="#383434" />
    <g transform="translate(346, 95)">
      <polygon points="6,2 6,47 19,36 26,50 33,46 26,32 40,32" fill="#f4f4f4" />
      <polygon points="10,9 10,40 19,32 26,44 29,43 22,29 33,29" fill="#191717" />
      <circle cx="7" cy="4" r="3" fill="#ffffff" />
    </g>
    <text x="370" y="180" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">Precision</text>
    <text x="370" y="196" text-anchor="middle" class="mono" font-size="9.5" fill="#8b8585">CAD reticle</text>
  </g>

  <!-- Card 4: Dot -->
  <g>
    <rect class="c4" x="444" y="76" width="130" height="134" rx="8" fill="#151313" stroke="#343030" />
    <rect x="458" y="88" width="102" height="72" rx="6" fill="#191717" stroke="#383434" />
    <circle cx="509" cy="124" r="17" fill="#f4f4f4" />
    <circle cx="509" cy="124" r="14.5" fill="#191717" />
    <circle cx="509" cy="124" r="6.5" fill="#ffffff" />
    <text x="509" y="180" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#ffffff">Dot</text>
    <text x="509" y="196" text-anchor="middle" class="mono" font-size="9.5" fill="#8b8585">Halo + core</text>
  </g>

  <!-- Gliding Live Pointer -->
  <g transform="translate(118, 136)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="118,136; 254,136; 390,136; 526,136; 118,136"
      keyTimes="0; 0.25; 0.5; 0.75; 1" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" fill-opacity="0.16">
      <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite" />
    </circle>
    <polygon points="0,0 0,18 5,14 8,20 10,19 7,13 13,13" fill="#ffffff" />
  </g>

  <!-- Bottom Cursor Shape Strip -->
  <rect x="36" y="224" width="538" height="52" rx="7" fill="#0d0b0b" stroke="#292525" />
  <text x="52" y="246" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">13 SHAPES + ALIASES</text>
  <text x="52" y="263" class="mono" font-size="9.5" fill="#7c7676">24 / 32 / 48px + vector SVG</text>

  <!-- Mini specimen icons (filled geometry for universal SVG clarity) -->
  <g fill="#f0f0f0">
    <!-- I-Beam -->
    <rect x="243" y="238" width="2.4" height="25" rx="1" />
    <rect x="238" y="238" width="12" height="2.4" rx="1" />
    <rect x="238" y="261" width="12" height="2.4" rx="1" />
    <text x="258" y="255" class="mono" font-size="9.5" fill="#c0baba">XTERM</text>
    <!-- Reticle -->
    <rect x="321" y="250" width="8" height="2.2" rx="1" />
    <rect x="339" y="250" width="8" height="2.2" rx="1" />
    <rect x="333" y="238" width="2.2" height="8" rx="1" />
    <rect x="333" y="256" width="2.2" height="8" rx="1" />
    <circle cx="334" cy="251" r="2" fill="#ffffff" />
    <text x="354" y="255" class="mono" font-size="9.5" fill="#c0baba">CROSS</text>
    <!-- Resize -->
    <rect x="413" y="250" width="22" height="2.2" rx="1" />
    <polygon points="411,251 417,246 417,256" />
    <polygon points="437,251 431,246 431,256" />
    <text x="444" y="255" class="mono" font-size="9.5" fill="#c0baba">RESIZE</text>
  </g>
  <!-- Spinning 8-frame Watch -->
  <g class="watch-rot">
    <circle cx="536" cy="251" r="11" fill="#a8a2a2" />
    <circle cx="536" cy="251" r="8.8" fill="#0d0b0b" />
    <circle cx="536" cy="240" r="3.2" fill="#ffffff" />
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT PANEL: KEYBOARD TYPE, LAYOUT & REPEAT PHYSICS STUDIO            -->
  <!-- ===================================================================== -->
  <rect x="610" y="20" width="570" height="270" rx="9" fill="#110f0f" stroke="#2e2a2a" />
  <text x="628" y="46" class="mono" font-size="11" font-weight="700" fill="#8e8888" letter-spacing="0.06em">
    02 / KEYBOARD TYPE &amp; KEYMAP STUDIO (KEYBOARD.SH)
  </text>
  <rect x="1028" y="31" width="134" height="22" rx="5" fill="#e8e8e8" />
  <text x="1095" y="46" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#080808">
    [CMK-DH] 60% HHKB
  </text>
  <line x1="610" y1="62" x2="1180" y2="62" stroke="#262323" />

  <!-- Architectural Monochrome Keycap Matrix -->
  <g transform="translate(628, 76)">
    <rect x="0" y="0" width="534" height="138" rx="8" fill="#0a0909" stroke="#292525" />

    <!-- Row 1: TAB + QWFPBJLUY; -->
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="54" height="26" rx="4" fill="#141212" stroke="#333030" />
      <text x="27" y="17" text-anchor="middle" class="mono" font-size="9.5" fill="#8e8888">TAB</text>

      <rect x="60" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="78" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">Q</text>
      <rect x="101" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="119" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">W</text>
      <rect class="kp1" x="142" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="160" y="17" text-anchor="middle" class="mono kt1" font-size="10.5" font-weight="700" fill="#d8d4d4">F</text>
      <rect x="183" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="201" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">P</text>
      <rect x="224" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="242" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">B</text>
      <rect x="265" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="283" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">J</text>
      <rect x="306" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="324" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">L</text>
      <rect class="kp2" x="347" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="365" y="17" text-anchor="middle" class="mono kt2" font-size="10.5" font-weight="700" fill="#d8d4d4">U</text>
      <rect x="388" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="406" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">Y</text>
      <rect x="429" y="0" width="85" height="26" rx="4" fill="#141212" stroke="#333030" />
      <text x="471" y="17" text-anchor="middle" class="mono" font-size="9.5" fill="#8e8888">BKSP</text>
    </g>

    <!-- Row 2: Remapped CAPS->ESC + Colemak-DH Home Row ARSTGMNEIO -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="66" height="26" rx="4" fill="#f4f4f4" stroke="#ffffff" />
      <text x="33" y="17" text-anchor="middle" class="mono" font-size="9.5" font-weight="800" fill="#080808">ESC / CAPS</text>

      <rect x="72" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="90" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">A</text>
      <rect class="kp2" x="113" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="131" y="17" text-anchor="middle" class="mono kt2" font-size="10.5" font-weight="700" fill="#d8d4d4">R</text>
      <rect class="kp3" x="154" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="172" y="17" text-anchor="middle" class="mono kt3" font-size="10.5" font-weight="700" fill="#d8d4d4">S</text>
      <rect class="kp1" x="195" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="213" y="17" text-anchor="middle" class="mono kt1" font-size="10.5" font-weight="700" fill="#d8d4d4">T</text>
      <rect x="236" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="254" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">G</text>
      <rect x="277" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="295" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">M</text>
      <rect class="kp3" x="318" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="336" y="17" text-anchor="middle" class="mono kt3" font-size="10.5" font-weight="700" fill="#d8d4d4">N</text>
      <rect class="kp1" x="359" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="377" y="17" text-anchor="middle" class="mono kt1" font-size="10.5" font-weight="700" fill="#d8d4d4">E</text>
      <rect x="400" y="0" width="36" height="26" rx="4" fill="#181616" stroke="#333030" />
      <text x="418" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8d4d4">I</text>
      <rect x="441" y="0" width="73" height="26" rx="4" fill="#141212" stroke="#333030" />
      <text x="477" y="17" text-anchor="middle" class="mono" font-size="9.5" fill="#8e8888">RETURN</text>
    </g>

    <!-- Row 3: SHIFT + ZXCDVKH -->
    <g transform="translate(10, 74)">
      <rect x="0" y="0" width="82" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="41" y="16" text-anchor="middle" class="mono" font-size="9.5" fill="#8e8888">SHIFT</text>
      <rect x="88" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="110" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">Z</text>
      <rect x="138" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="160" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">X</text>
      <rect x="188" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="210" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">C</text>
      <rect x="238" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="260" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">D</text>
      <rect x="288" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="310" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">V</text>
      <rect x="338" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="360" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">K</text>
      <rect x="388" y="0" width="44" height="24" rx="4" fill="#181616" stroke="#333030" />
      <text x="410" y="16" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#d8d4d4">H</text>
      <rect x="438" y="0" width="76" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="476" y="16" text-anchor="middle" class="mono" font-size="9.5" fill="#8e8888">SHIFT</text>
    </g>

    <!-- Row 4: Modifiers + Spacebar -->
    <g transform="translate(10, 104)">
      <rect x="0" y="0" width="58" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="29" y="16" text-anchor="middle" class="mono" font-size="9" fill="#8e8888">CTRL</text>
      <rect x="64" y="0" width="62" height="24" rx="4" fill="#1c1a1a" stroke="#524d4d" />
      <text x="95" y="16" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#ffffff">SUPER</text>
      <rect x="132" y="0" width="54" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="159" y="16" text-anchor="middle" class="mono" font-size="9" fill="#8e8888">ALT</text>
      <rect x="192" y="0" width="194" height="24" rx="4" fill="#181616" stroke="#3d3838" />
      <text x="289" y="16" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#dcd8d8">ANSI / ISO / 60% / APPLE / VIM</text>
      <rect x="392" y="0" width="58" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="421" y="16" text-anchor="middle" class="mono" font-size="9" fill="#8e8888">ALTGR</text>
      <rect x="456" y="0" width="58" height="24" rx="4" fill="#141212" stroke="#333030" />
      <text x="485" y="16" text-anchor="middle" class="mono" font-size="9" fill="#8e8888">FN</text>
    </g>
  </g>

  <!-- Bottom Keyboard Spec Strip -->
  <rect x="628" y="224" width="534" height="52" rx="7" fill="#0d0b0b" stroke="#292525" />
  <text x="644" y="245" class="mono" font-size="10" font-weight="700" fill="#ffffff">
    7 HARDWARE TYPES  /  14 XKB PRESETS  /  3 REPEAT PROFILES
  </text>
  <text x="644" y="263" class="mono" font-size="9.5" fill="#888282">
    Super + X cycles layouts  |  Super + Shift + X opens Keyboard Studio  |  Waybar pill live
  </text>
</svg>
