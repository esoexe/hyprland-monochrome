# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/kitty/theme.conf — monochrome palette for kitty
#
#  A pure greyscale ramp: black surfaces, white text, greys in between.
#  Replace the hex values to recolour the terminal and the whole 16-colour
#  ramp (ls, git diff, htop …) follows.
# ═══════════════════════════════════════════════════════════════════════════

# Surfaces and text
background            #0a0a0a
foreground            #e6e6e6
selection_background  #e6e6e6
selection_foreground  #0a0a0a
cursor                #e6e6e6
cursor_text_color     #0a0a0a
url_color             #bdbdbd

# Greyscale ANSI ramp — colour0/8 are the darks, 7/15 the bright whites
color0  #141414
color1  #9a9a9a
color2  #b0b0b0
color3  #c4c4c4
color4  #8a8a8a
color5  #a8a8a8
color6  #bdbdbd
color7  #d6d6d6
color8  #4a4a4a
color9  #c8c8c8
color10 #d2d2d2
color11 #dedede
color12 #bcbcbc
color13 #cccccc
color14 #dadada
color15 #ffffff

# Borders (used by some layouts / splits)
active_border_color   #e6e6e6
inactive_border_color #2a2a2a
