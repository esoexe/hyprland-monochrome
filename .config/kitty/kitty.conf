# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/kitty/kitty.conf — hyprland-monochrome
#
#  Colours live in theme.conf (same folder) so you can swap the whole palette
#  without touching anything else.
# ═══════════════════════════════════════════════════════════════════════════

include theme.conf

# ── Font ──────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never
adjust_line_height 0

# ── Window ────────────────────────────────────────────────────────────────
window_padding_width 14
placement_strategy   center
hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor ────────────────────────────────────────────────────────────────
cursor_shape         block
cursor_blink_interval 0.5
shell_integration     enabled

# ── Scrolling / mouse ─────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 5.0
mouse_hide_wait 3.0
copy_on_select  clipboard
strip_trailing_spaces smart

# ── Tabs ──────────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
tab_activity_symbol   ""

# ── Behaviour ─────────────────────────────────────────────────────────────
enable_audio_bell no
update_check_interval 24
remember_window_size yes
initial_window_width  1000
initial_window_height 600
enabled_layouts splits:stack
shell zsh

# ── Transparency (Hyprland also blurs behind kitty) ───────────────────────
background_opacity 0.92
dynamic_background_opacity yes

# ── Keybinds on top of kitty's defaults ───────────────────────────────────
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+left   previous_tab
map ctrl+shift+right  next_tab
map ctrl+plus         change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0
map ctrl+shift+h      show_scrollback
map kitty_mod+o       open_url_with_hints
