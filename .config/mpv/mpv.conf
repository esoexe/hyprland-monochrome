# ═══════════════════════════════════════════════════════════════════════════
#  mpv — Universal Wayland GPU Media Player (AMD / Intel / NVIDIA / VM safe)
# ═══════════════════════════════════════════════════════════════════════════

vo=gpu-next
gpu-context=wayland
hwdec=auto-safe
profile=fast
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%

# Monochrome OpenCode OSD
osd-font="JetBrainsMono Nerd Font"
osd-font-size=24
osd-color="#FDFCFC"
osd-border-color="#131010"
osd-back-color="#CC131010"
osd-border-size=1.5
osd-bar-h=2
osd-bar-w=60
sub-font="JetBrainsMono Nerd Font"
sub-font-size=38
sub-color="#FDFCFC"
sub-border-color="#0A0A0A"
sub-border-size=2
