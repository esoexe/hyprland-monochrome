# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/btop/btop.conf — hyprland-monochrome
#  Only the interesting keys are listed here; btop fills in the rest itself
#  the first time you run it (press Esc → Options to change anything).
# ═══════════════════════════════════════════════════════════════════════════

# Theme: the monochrome one shipped next to this file
color_theme = "mono"
theme_background = True
truecolor = True

# Layout
shown_boxes = "cpu mem net proc"
update_ms = 1500
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_per_core = False
proc_mem_bytes = True
proc_left = False
show_coretemp = True
show_gpu_info = "Auto"
check_temp = True
cpu_single_graph = False

# Graphs
graph_symbol = "braille"
graph_symbol_cpu = "default"
show_battery = True
show_uptime = True
show_swap = True
show_disks = True
only_physical = True

# Clock / UI
clock_format = "%H:%M"
vim_keys = True
rounded_corners = True
terminal_sync = True
mouse_sync = False
show_disk_io = True
mem_graphs = True
show_io_stat = True
io_mode = False
update_on_battery = True
