# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/hypr/hyprsunset.conf — automatic blue-light filter
#
#  hyprsunset starts with the session (see modules/autostart.lua) and applies
#  whichever profile matches the current time.
#
#  Manual control:
#    hyprctl hyprsunset temperature 4000   # warmer (lower = warmer)
#    hyprctl hyprsunset identity            # filter off
#    hyprctl hyprsunset gamma 85            # dim to 85%
#    ~/.config/hypr/scripts/nightshift.sh toggle      (Super + SHIFT + N)
# ═══════════════════════════════════════════════════════════════════════════

max-gamma = 150

# Daytime — no filter at all
profile {
    time = 7:30
    identity = true
}

# Evening — warm and slightly dimmed
profile {
    time = 21:00
    temperature = 4000
    gamma = 0.9
}

# Late night — warmer and dimmer (delete if you find it too orange)
profile {
    time = 23:30
    temperature = 3500
    gamma = 0.8
}
