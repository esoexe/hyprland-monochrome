# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/hypr/hypridle.conf — idle behaviour
#
#  Timings are in seconds. Delete a listener block to disable that behaviour,
#  or change the numbers to taste (300 = 5 minutes).
# ═══════════════════════════════════════════════════════════════════════════

general {
    lock_cmd = pidof hyprlock || hyprlock          # never start two lockscreens
    before_sleep_cmd = loginctl lock-session       # lock before suspending
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false                    # respect video players
}

# ── 4 minutes: dim the brightness a little as a warning ───────────────────
# (comment out on desktops with no backlight)
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 15%
    on-resume  = brightnessctl -r
}

# ── 5 minutes: lock the screen ────────────────────────────────────────────
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ── 5.5 minutes: turn the display off ─────────────────────────────────────
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# ── 20 minutes: suspend ───────────────────────────────────────────────────
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}

