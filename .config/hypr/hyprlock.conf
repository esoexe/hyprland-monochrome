# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/hypr/hyprlock.conf — architectural monochrome lock screen
#
#  Super + TAB locks the screen (or `hyprlock` from a terminal).
#  Zero colour leaks — check_color & fail_color stay strictly greyscale.
# ═══════════════════════════════════════════════════════════════════════════

$font   = JetBrainsMono Nerd Font
$text   = rgba(238, 238, 238, 1.0)
$bright = rgba(255, 255, 255, 1.0)
$dim    = rgba(145, 145, 145, 1.0)
$faint  = rgba(95, 95, 95, 1.0)
$dark   = rgba(10, 10, 10, 0.78)
$line   = rgba(255, 255, 255, 0.11)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = monoOut, 0.16, 1.0, 0.3, 1.0
    animation = fadeIn, 1, 4, monoOut
    animation = fadeOut, 1, 4, monoOut
    animation = inputFieldDots, 1, 2, monoOut
}

# Blurred live desktop dimmed to deep obsidian, zero saturation/vibrancy.
background {
    monitor =
    path = screenshot
    color = rgba(8, 8, 8, 1.0)
    blur_passes = 4
    blur_size = 9
    noise = 0.02
    contrast = 1.04
    brightness = 0.64
    vibrancy = 0.0
}

# ── Top status pill (Focus sprint / host / battery) ──────────────────────
shape {
    monitor =
    size = 380, 34
    color = $dark
    rounding = 17
    border_size = 1
    border_color = $line
    position = 0, -28
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:5000] sh -c 'f="$(~/.config/hypr/scripts/focus.sh status 2>/dev/null || echo off)"; b="$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)"; printf "%s" "$(hostname)"; [ "$f" != "off" ] && printf "  ·  ◎ %s" "$f"; [ -n "$b" ] && printf "  ·  %s%%" "$b"'
    font_family = $font
    font_size = 10
    color = $dim
    position = 0, -35
    halign = center
    valign = top
}

# ── Architectural clock & date ────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 94
    color = $bright
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B %Y"
    font_family = $font
    font_size = 14
    color = $dim
    position = 0, -132
    halign = center
    valign = center
}

# ── Password pill (strictly monochrome check/fail states) ─────────────────
shape {
    monitor =
    size = 340, 52
    color = $dark
    rounding = 14
    border_size = 1
    border_color = $line
    position = 0, 44
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 1
    outer_color = $line
    inner_color = rgba(0, 0, 0, 0.0)
    check_color = rgba(230, 230, 230, 0.85)
    fail_color  = rgba(255, 255, 255, 0.95)
    capslock_color = rgba(200, 200, 200, 0.70)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    rounding = 14
    font_color = $text
    font_family = $font
    placeholder_text = <span color='rgba(115,115,115,1.0)'>enter password</span>
    fail_text = <span color='rgba(255,255,255,1.0)'>incorrect ($ATTEMPTS)</span>
    check_text = <span color='rgba(185,185,185,1.0)'>verifying…</span>
    position = 0, 44
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER  ·  $LAYOUT[us,ara]
    font_family = $font
    font_size = 11
    color = $faint
    position = 0, 102
    halign = center
    valign = center
}

# ── Bottom Now-Playing MPRIS readout (vanishes when silent) ──────────────
label {
    monitor =
    text = cmd[update:3000] sh -c 'playerctl metadata --format "♫  {{title}} — {{artist}}" 2>/dev/null | cut -c1-64 || true'
    font_family = $font
    font_size = 11
    color = $dim
    position = 0, 36
    halign = center
    valign = bottom
}
