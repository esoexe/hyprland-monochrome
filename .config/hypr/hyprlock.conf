# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/hypr/hyprlock.conf — monochrome lock screen
#
#  Super + TAB locks the screen (or `hyprlock` from a terminal).
#  Test it safely first:  hyprlock -c ~/.config/hypr/hyprlock.conf
# ═══════════════════════════════════════════════════════════════════════════

$font = JetBrainsMono Nerd Font
$text = rgba(230, 230, 230, 1.0)
$dim  = rgba(150, 150, 150, 1.0)
$dark = rgba(10, 10, 10, 0.72)
$line = rgba(255, 255, 255, 0.10)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
    text_trim = true
    fail_timeout = 1500
}

# Optional: unlock with a fingerprint reader as well
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan your finger
#         present_message = Reading…
#     }
# }

animations {
    enabled = true
    bezier = monoOut, 0.16, 1.0, 0.3, 1.0
    animation = fadeIn, 1, 4, monoOut
    animation = fadeOut, 1, 4, monoOut
    animation = inputFieldDots, 1, 2, monoOut
}

# A blurred screenshot of whatever was on screen, dimmed to near-black.
background {
    monitor =
    path = screenshot
    color = rgba(8, 8, 8, 1.0)
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.70
    vibrancy = 0.0
}

# ── Clock ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 84
    color = $text
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = $font
    font_size = 16
    color = $dim
    position = 0, -110
    halign = center
    valign = center
}

# ── Password field ────────────────────────────────────────────────────────
shape {
    monitor =
    size = 320, 52
    color = $dark
    rounding = 14
    border_size = 1
    border_color = $line
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 0
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    rounding = 14
    inner_color = rgba(0, 0, 0, 0.0)
    font_color = $text
    font_family = $font
    placeholder_text = <span color='rgba(120,120,120,1.0)'>enter password</span>
    fail_text = <span color='rgba(255,255,255,1.0)'>wrong password ($ATTEMPTS)</span>
    check_text = <span color='rgba(180,180,180,1.0)'>authenticating…</span>
    position = 0, 40
    halign = center
    valign = center
}

# ── Details ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER  ·  $LAYOUT[us,ara]
    font_family = $font
    font_size = 11
    color = rgba(120, 120, 120, 1.0)
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/$/% battery/'
    font_family = $font
    font_size = 11
    color = rgba(120, 120, 120, 1.0)
    position = 0, -178
    halign = center
    valign = center
}

label {
    monitor =
    text = esc clears  ·  enter unlocks
    font_family = $font
    font_size = 10
    color = rgba(90, 90, 90, 1.0)
    position = 0, -30
    halign = center
    valign = bottom
}
